# Configuração global do Spring durante os testes (lida pelo SpringProperties no arranque).
#
# Limita a UM o número de ApplicationContexts do Spring vivos ao mesmo tempo.
# Porquê: cada @SpringBootTest de integração define um `spring.datasource.url` próprio
# (h2:auth-contract, h2:security-api, h2:comercial-contract, h2:hr-api, h2:money-flow, …),
# o que gera um contexto DISTINTO por classe. A cache de contextos NÃO os reutiliza (chaves
# diferentes) mas mantém-nos TODOS vivos em simultâneo — 8 contextos ERP completos (22 módulos +
# Hibernate + pool + beans Swing) → a RAM rebenta localmente e a suite só corria na CI.
#
# Com maxSize=1 a cache evicta (e fecha) o contexto anterior antes de construir o próximo, pelo que
# só ~1 contexto pesado está vivo de cada vez. Não há perda de reutilização aqui (cada contexto já
# era usado por uma só classe), apenas o pico de memória cai ~8x. Ver tasks/current.md.
spring.test.context.cache.maxSize=1
