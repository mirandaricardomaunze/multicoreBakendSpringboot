# During the incremental migration the desktop starts the backend locally.
# Production installers should override this with an HTTPS backend URL.
desktop.api.base-url=${DESKTOP_API_BASE_URL:http://localhost:8080}

# ─── Base de dados real: PostgreSQL local ─────────────────────────────
# O desktop usa o PostgreSQL local (dados persistentes), não o H2 em memória.
# A password vem da variável de ambiente DB_PASSWORD (nunca commitada).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/multicore}
spring.datasource.username=${DB_USER:multicore}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Flyway é dono do schema (V1..V17); Hibernate apenas VALIDA — igual a prod.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# H2 console não faz sentido com PostgreSQL.
spring.h2.console.enabled=false
