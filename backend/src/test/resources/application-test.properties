# Perfil de teste (@ActiveProfiles("test")). Sobrepõe application.properties APENAS no que poupa
# memória/tempo — o datasource H2 vem da base (ou é sobreposto por cada @SpringBootTest).
#
# NÃO definir spring.main.headless aqui: os testes de contexto completo (ex.: MulticoreServicesTest)
# carregam beans Swing de mz.multicore.erp.gui.* e exigem java.awt.headless=false. Deixar a base/o próprio
# teste tratar disso — forçar headless=true partiria esses testes com HeadlessException.

# Pool mínimo — os testes não precisam de muitas ligações; menos threads e menos memória.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0

# Contexto mais leve: não testamos a documentação OpenAPI/Swagger nem a consola H2.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.h2.console.enabled=false

# Silêncio durante os testes (o output de SQL/Spring polui e abranda).
spring.jpa.show-sql=false
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
