server.port=8080
spring.main.headless=true

# ─── PROD: PostgreSQL gerido externamente ─────────────────────────────
# As variáveis de ambiente são obrigatórias — não há defaults para evitar fugas.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Pool HikariCP — com resiliência a ligações mortas (ver docs/RESILIENCIA_LIGACOES_SPEC.md).
# keepalive-time sonda ligações ociosas; max-lifetime rota-as. keepalive-time < max-lifetime.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=5000

# JPA/Hibernate — Flyway é dono do schema; Hibernate só VALIDA.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Capacidade HTTP ajustavel sem reconstruir o artefacto. Os defaults sao deliberadamente
# conservadores para uma unica instancia; aumentar so depois de medir PostgreSQL e Hikari.
server.tomcat.threads.max=${HTTP_MAX_THREADS:200}
server.tomcat.threads.min-spare=${HTTP_MIN_SPARE_THREADS:10}
server.tomcat.max-connections=${HTTP_MAX_CONNECTIONS:8192}
server.tomcat.accept-count=${HTTP_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${HTTP_CONNECTION_TIMEOUT:20s}

# Um restart deixa de cortar transaccoes HTTP que ja estavam em curso.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}

# Health groups distinguem processo vivo de dependencia pronta. Metricas ficam acessiveis apenas
# na rede interna: o Caddy publico encaminha exclusivamente /api/*.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# H2 console nunca em prod
spring.h2.console.enabled=false

# Springdoc — manter desactivado em prod até haver autenticação para a UI.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging
logging.level.root=INFO
logging.level.mz.multicore.erp=INFO
logging.level.org.hibernate.SQL=WARN

# Cópia de segurança física automática (recuperação de desastres).
backup.schedule.enabled=true
backup.schedule.cron=0 0 23 * * *
backup.retention-days=30

# ─── Seed em produção ──────────────────────────────────────────────────────
# NÃO semear dados de demonstração (empresas/utilizadores/produtos fictícios).
# Taxas de IVA e categorias (dados de referência) continuam a ser semeadas.
app.seed-demo-data=false
# Superadmin: senha só por ambiente. Se SUPERADMIN_PASSWORD não estiver definida,
# a conta NÃO é criada automaticamente (evita superadmin/superadmin em produção).
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# ─── Compatibilidade com os desktops instalados ────────────────────────────
# Por ambiente, porque é uma decisão de operação e não de código: sobe-se quando uma versão
# nova do servidor deixa de aceitar clientes antigos. Enquanto for 0.0.0 não bloqueia ninguém.
# ATENÇÃO: subir isto tranca todas as lojas que ainda não actualizaram — avisar antes.
app.client.min-version=${APP_CLIENT_MIN_VERSION:0.0.0}

# ─── Cifra de anexos em repouso ───────────────────────────────────────
# Comprovativos de exames de saúde ocupacional são documentos clínicos: cifrados com AES-256-GCM
# antes de chegarem à base de dados, logo ilegíveis também em backup. Chave de 32 bytes em Base64:
#   openssl rand -base64 32
# Vazio = não cifra (comportamento anterior). Anexos gravados em claro continuam a abrir.
# PERDER A CHAVE É PERDER OS ANEXOS CIFRADOS COM ELA — guardar com os restantes segredos de produção.
security.attachment-key=${ATTACHMENT_KEY:}

# So confiar no X-Forwarded-For recebido directamente do proxy canonico.
security.trusted-proxy-host=${TRUSTED_PROXY_HOST:}
