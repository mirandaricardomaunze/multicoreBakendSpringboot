name: build

# Corre em TODAS as branches e PRs — não só main — para que as branches de
# trabalho (feat/*, fix/*) tenham rede de segurança antes de fundir.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Menor privilégio para o GITHUB_TOKEN (só precisa de ler o código).
permissions:
  contents: read

env:
  # A suite de integração Spring é pesada; o runner tem folga (~7 GB).
  MAVEN_OPTS: -Xmx3g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean compile

      # Corre a SUITE COMPLETA: os *IntegrationTest (Spring/MockMvc) são apanhados pelo
      # surefire tal como os testes unitários. Qualquer falha reprova o build (e o merge,
      # se a proteção de branch estiver ligada — ver README "CI e gate de merge").
      # Os testes correm em H2 in-memory (sem PostgreSQL). O smoke de UI (Swing) precisa de
      # um display virtual → xvfb-run.
      - name: Run tests (suite completa — unit + integração Spring)
        run: xvfb-run -a mvn -B -ntp test

      - name: Publish failing tests as annotations
        if: failure()
        run: |
          grep -rhE -A3 '<<< (FAILURE|ERROR)!' --include='*.txt' ./*/target/surefire-reports > failures.txt || true
          split -b 3000 failures.txt failure-part-
          for part in $(ls failure-part-* 2>/dev/null | head -n 9); do
            echo "::error::$(sed 's/%/%25/g' "$part" | awk '{printf "%s%%0A", $0}')"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

      - name: Package (skip tests — já correram)
        run: mvn -B -ntp -DskipTests package

  # Dependência com vulnerabilidade conhecida reprova o build. Excepções, com motivo, em
  # scripts/vulnerability-exceptions.txt. Ver docs/SEGURANCA_CONTAS_E_SEGREDOS_SPEC.md.
  dependency-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check dependencies against OSV
        run: python3 scripts/check-vulnerabilities.py

  # A suite acima corre em H2 sem Flyway. Este job aplica as migrações em PostgreSQL real e prova
  # a paridade com as entidades e o ciclo backup/restauro. Ver docs/POSTGRES_SCHEMA_PARITY_SPEC.md.
  postgres-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install PostgreSQL binaries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql

      - name: Verify migrations, schema parity and backup/restore
        shell: pwsh
        run: ./scripts/verify-backup-restore.ps1 -PgBinDir (Get-ChildItem -Directory /usr/lib/postgresql/*/bin | Sort-Object FullName | Select-Object -Last 1).FullName

      - name: Publish PostgreSQL verification logs as annotations
        if: failure()
        run: |
          grep -rhE -A3 '<<< (FAILURE|ERROR)!' --include='*.txt' ./backend/target/surefire-reports > failures.txt || true
          find data/restore-validation -maxdepth 2 -name '*.log' -exec tail -n 15 {} + >> failures.txt 2>/dev/null || true
          split -b 3000 failures.txt failure-part-
          for part in $(ls failure-part-* 2>/dev/null | head -n 9); do
            echo "::error::$(sed 's/%/%25/g' "$part" | awk '{printf "%s%%0A", $0}')"
          done
