name: build

# Corre em TODAS as branches e PRs — não só main — para que as branches de
# trabalho (feat/*, fix/*) tenham rede de segurança antes de fundir.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # A suite de integração Spring é pesada; o runner tem folga (~7 GB).
  MAVEN_OPTS: -Xmx3g

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean compile

      # Os testes correm em H2 in-memory (sem PostgreSQL). O smoke test de UI (Swing)
      # precisa de um display virtual → xvfb-run.
      - name: Run tests
        run: xvfb-run -a mvn -B -ntp test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore

      - name: Package (skip tests — já correram)
        run: mvn -B -ntp -DskipTests package
