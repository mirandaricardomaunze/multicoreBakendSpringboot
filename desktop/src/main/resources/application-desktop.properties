# ─── Perfil DESKTOP (cliente-fino) ───────────────────────────────────────────
# O desktop NÃO liga à base de dados nem carrega JPA/serviços de backend — é apenas
# a UI Swing + os clientes HTTP. Toda a lógica de negócio vive no backend, acedido por
# este URL (ver DesktopApplication: contexto não-web, sem DataSourceAutoConfiguration).
#
# Em produção, o instalador aponta para o backend por HTTPS, por exemplo:
#   DESKTOP_API_BASE_URL=https://api.aminhaempresa.co.mz
#
# Consequência: o desktop já não precisa de acesso directo à base de dados, pelo que o
# PostgreSQL pode ficar acessível apenas ao backend (fechado ao exterior).
desktop.api.base-url=${DESKTOP_API_BASE_URL:http://localhost:8080}
